    server {
        listen 443 ssl;
        server_name chess.kjt.lol;
        http2 on;
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        root /public/chess;
        index index.html;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location / { add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always; try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
        location = /models/pawnstar-medium-106575-7a3587112b5c-int8.onnx {
            add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
            types { application/octet-stream onnx; }
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            gzip off;
            try_files $uri =404;
        }
        location /models/ {
            add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
            types { application/octet-stream onnx; }
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }
        location ^~ /ort/1.31.1/ {
            add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            types { application/wasm wasm; application/javascript mjs; }
            try_files $uri =404;
        }
        location ~* \.(wasm|mjs)$ {
            add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
            types { application/wasm wasm; application/javascript mjs; }
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }
        location /assets/ { add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    }
