[package]
name = "chess-preprocess"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
shakmaty = "=0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
rayon = "1"
blake2b_simd = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zip = { version = "2", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
